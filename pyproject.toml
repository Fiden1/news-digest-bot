readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "markdown>=3.11.3",
    "ollama>=0.6.2",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
]
